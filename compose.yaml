x-flagforge: &flagforge
  build: .
  image: flagforge:local
  environment:
    FLAGFORGE_DATABASE_URL: postgres://flagforge:flagforge@postgres:5432/flagforge?sslmode=disable
    FLAGFORGE_ADMIN_KEYS: hamza=hamza-dev-key-0123456789abcdef0123
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
      POSTGRES_DB: flagforge
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge"]
      interval: 2s
      timeout: 2s
      retries: 15

  flagforge-a:
    <<: *flagforge
    ports:
      - "8081:8080"

  flagforge-b:
    <<: *flagforge
    ports:
      - "8082:8080"

volumes:
  pgdata:
